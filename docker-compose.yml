version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: procurement-postgres
    environment:
      POSTGRES_USER: procurement
      POSTGRES_PASSWORD: procurement_secret
      POSTGRES_DB: procurement_ai
    ports:
      - '5450:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U procurement -d procurement_ai']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: procurement-redis
    ports:
      - '6350:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
