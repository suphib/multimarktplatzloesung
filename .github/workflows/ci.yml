name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: procurement
          POSTGRES_PASSWORD: procurement_secret
          POSTGRES_DB: procurement_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run test
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USERNAME: procurement
          DATABASE_PASSWORD: procurement_secret
          DATABASE_NAME: procurement_ai
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 45.145.226.60
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/procurement || exit 1
            echo "📥 Pulling latest changes..."
            git pull origin main
            echo "🐳 Rebuilding Docker containers..."
            docker compose -f docker-compose.prod.yml build --no-cache
            echo "🔄 Restarting services..."
            docker compose -f docker-compose.prod.yml up -d
            echo "🌱 Seeding database..."
            sleep 10
            docker compose -f docker-compose.prod.yml exec -T api node dist/config/seed.js || echo "⚠️ Seed skipped (non-critical)"
            echo "🧹 Cleaning up old images..."
            docker image prune -f
            echo "✅ Deployment complete!"
