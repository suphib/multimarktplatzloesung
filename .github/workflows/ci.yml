name: CI

on:
  push:
    branches: [main]
    tags: ['app/*', 'website/*']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: procurement
          POSTGRES_PASSWORD: procurement_secret
          POSTGRES_DB: procurement_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run test
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USERNAME: procurement
          DATABASE_PASSWORD: procurement_secret
          DATABASE_NAME: procurement_ai
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  e2e-website:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build --workspace=apps/website

      - run: npx playwright install --with-deps chromium

      - run: npx playwright test --config playwright.website.config.ts

  deploy-app:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/app/')

    steps:
      - name: Deploy app to production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 45.145.226.60
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/procurement || exit 1
            git fetch --tags
            git checkout ${{ github.ref_name }}
            docker compose -f docker-compose.prod.yml build --no-cache api web
            docker compose -f docker-compose.prod.yml up -d api web
            sleep 10
            docker compose -f docker-compose.prod.yml exec -T api node dist/config/seed.js || true
            docker image prune -f

  deploy-website:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/website/')

    steps:
      - name: Deploy website to production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 45.145.226.60
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/procurement || exit 1
            git fetch --tags
            git checkout ${{ github.ref_name }}
            docker compose -f docker-compose.prod.yml build --no-cache website
            docker compose -f docker-compose.prod.yml up -d website
            docker image prune -f
