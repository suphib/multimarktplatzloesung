version: '3.8'

networks:
  procurement-network:
    name: procurement-dlr
    driver: bridge
  # Connect to casamanager's nginx proxy network
  casamanager-demo:
    external: true
    name: casamanager-demo

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: procurement-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: procurement
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-procurement_secret}
      POSTGRES_DB: procurement_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U procurement -d procurement_ai']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - procurement-network

  redis:
    image: redis:7-alpine
    container_name: procurement-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - procurement-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: procurement-api
    restart: unless-stopped
    environment:
      DATABASE_HOST: procurement-postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: procurement
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-procurement_secret}
      DATABASE_NAME: procurement_ai
      REDIS_HOST: procurement-redis
      REDIS_PORT: 6379
      API_PORT: 3000
      API_PREFIX: api/v1
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-02-01}
      AZURE_OPENAI_DEPLOYMENT_CHAT: ${AZURE_OPENAI_DEPLOYMENT_CHAT:-gpt-4}
      AZURE_OPENAI_DEPLOYMENT_EMBEDDING: ${AZURE_OPENAI_DEPLOYMENT_EMBEDDING:-text-embedding-ada-002}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - procurement-network
      - casamanager-demo

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: procurement-web
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - procurement-network
      - casamanager-demo

  website:
    build:
      context: .
      dockerfile: apps/website/Dockerfile
    container_name: procurement-website
    restart: unless-stopped
    networks:
      - procurement-network
      - casamanager-demo

volumes:
  postgres_data:
  redis_data:
